kind = "web"
previewPath = "/"
title = "Legal Screen Builder"
version = "1.0.0"
id = "artifacts/legal-screen-builder"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25466

[services.development]
run = "pnpm --filter @workspace/legal-screen-builder run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/legal-screen-builder", "run", "build" ]
publicDir = "artifacts/legal-screen-builder/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25466"
BASE_PATH = "/"
